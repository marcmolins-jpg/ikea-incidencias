<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencias Global — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;padding:24px}
  h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .subtitle{font-size:13px;color:#64748B;margin-bottom:24px}
  .kpis{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .kpi{background:#fff;border-radius:12px;padding:16px 24px;flex:1;min-width:140px;border:1px solid #E2E8F0}
  .kpi-val{font-size:28px;font-weight:700}
  .kpi-lbl{font-size:12px;color:#64748B;margin-top:2px}
  .kpi-red .kpi-val{color:#EF4444}
  .kpi-yellow .kpi-val{color:#F59E0B}
  .kpi-green .kpi-val{color:#10B981}
  .charts{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
  .card{background:#fff;border-radius:12px;padding:20px;border:1px solid #E2E8F0}
  .card h2{font-size:14px;font-weight:600;margin-bottom:16px;color:#374151}
  .full{grid-column:1/-1}
  canvas{max-height:280px}
  .footer{font-size:11px;color:#94A3B8;text-align:right;margin-top:16px}
</style>
</head>
<body>
<h1>Dashboard global de incidencias</h1>
<p class="subtitle">Últimos 30 días · Todos los merchants · Actualizado: 21/04/2026 13:29</p>


    <div class="kpis">
      <div class="kpi"><div class="kpi-val">0</div><div class="kpi-lbl">Total tickets</div></div>
      <div class="kpi kpi-red"><div class="kpi-val">0</div><div class="kpi-lbl">Abiertos</div></div>
      <div class="kpi kpi-yellow"><div class="kpi-val">0</div><div class="kpi-lbl">Pendientes</div></div>
      <div class="kpi kpi-green"><div class="kpi-val">0</div><div class="kpi-lbl">Resueltos</div></div>
    </div>

<div class="charts">
  <div class="card">
    <h2>Volumen por tipología</h2>
    <canvas id="barChart"></canvas>
  </div>
  <div class="card">
    <h2>Estado de tickets</h2>
    <canvas id="donutChart"></canvas>
  </div>
  <div class="card full">
    <h2>Evolución diaria por tipología</h2>
    <canvas id="timelineChart"></canvas>
  </div>
</div>

<div class="footer">Datos extraídos de Zendesk · nemuru.zendesk.com</div>

<script>
const COLORS = ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6"];

new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: ["Estados", "Documental", "KYC", "Firma", "T\u00e9cnica"],
    datasets: [{
      data: [0, 0, 0, 0, 0],
      backgroundColor: COLORS,
      borderRadius: 4,
      borderSkipped: false,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display: false }, ticks: { color: '#6B7280' } },
      y: { beginAtZero: true, ticks: { color: '#6B7280', stepSize: 1 }, grid: { color: 'rgba(0,0,0,0.06)' } }
    }
  }
});

new Chart(document.getElementById('donutChart'), {
  type: 'doughnut',
  data: {
    labels: ["Nuevos", "Abiertos", "Pendientes", "Resueltos", "Cerrados"],
    datasets: [{ data: [0, 0, 0, 0, 0], backgroundColor: ['#94A3B8','#3B82F6','#F59E0B','#10B981','#6B7280'], borderWidth: 0 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } } }
});

new Chart(document.getElementById('timelineChart'), {
  type: 'bar',
  data: {
    labels: [],
    datasets: [{"label": "Estados", "data": [], "backgroundColor": "#3B82F6", "borderRadius": 2, "borderSkipped": false}, {"label": "Documental", "data": [], "backgroundColor": "#10B981", "borderRadius": 2, "borderSkipped": false}, {"label": "KYC", "data": [], "backgroundColor": "#F59E0B", "borderRadius": 2, "borderSkipped": false}, {"label": "Firma", "data": [], "backgroundColor": "#EF4444", "borderRadius": 2, "borderSkipped": false}, {"label": "T\u00e9cnica", "data": [], "backgroundColor": "#8B5CF6", "borderRadius": 2, "borderSkipped": false}]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } },
    scales: {
      x: { stacked: true, grid: { display: false }, ticks: { color: '#6B7280', font: { size: 10 }, maxRotation: 45, autoSkip: false } },
      y: { stacked: true, beginAtZero: true, ticks: { color: '#6B7280', stepSize: 1 }, grid: { color: 'rgba(0,0,0,0.06)' } }
    }
  }
});
</script>
</body>
</html>
